name: Release

# Builds an official StreamBridge release from a tag in the private source repository and
# publishes it here. Run it from main: the tag of the same name is created in this repository on
# the commit the run started from, so GitHub's build signature ties the archive to that tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing source tag to build and publish (for example v4.1.68)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  actions: write
  artifact-metadata: write
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ inputs.tag }}
  SOURCE_REPOSITORY: surakage/THSV-StreamBridge

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    environment:
      name: streambridge-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }}
    env:
      THSV_WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'unsigned' }}
      THSV_WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      THSV_WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
      THSV_WINDOWS_SIGNING_ALLOWED_THUMBPRINTS: ${{ secrets.WINDOWS_SIGNING_ALLOWED_THUMBPRINTS }}
      THSV_WINDOWS_SIGNING_MINIMUM_VALIDITY_DAYS: '30'
      THSV_WINDOWS_SIGNING_EXPIRY_WARNING_DAYS: '60'
    steps:
      - name: Validate the selected release tag
        shell: powershell
        run: if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid release tag.' }
      - name: Check the source access key is configured
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        shell: powershell
        run: if ([string]::IsNullOrWhiteSpace($env:SOURCE_REPO_TOKEN)) { throw 'Add the SOURCE_REPO_TOKEN secret (read-only access to the source repository).' }
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the exact tagged source commit
        shell: powershell
        run: |
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $checkedOutCommit) { throw "Checked out $checkedOutCommit but $env:RELEASE_TAG resolves to $tagCommit." }
          "RELEASE_COMMIT_SHA=$checkedOutCommit" >> $env:GITHUB_ENV
      - name: Refuse a tag that is already published here
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "$env:RELEASE_TAG already exists in $env:GITHUB_REPOSITORY." }
          exit 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated Windows startup-chaos acceptance
        shell: powershell
        run: npm run test:startup-chaos
      - name: Restore checksum-verified portable Node runtime cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/node-runtime
          key: portable-node-runtime-${{ runner.os }}-22.23.1-release-${{ hashFiles('scripts/package-release.ps1') }}
          restore-keys: |
            portable-node-runtime-${{ runner.os }}-22.23.1-
      - name: Prepare optional Windows code-signing identity
        shell: powershell
        run: |
          $signingMode = $env:THSV_WINDOWS_SIGNING_MODE.Trim().ToLowerInvariant()
          if ($signingMode -notin @('unsigned', 'certificate')) { throw "WINDOWS_SIGNING_MODE must be unsigned or certificate; received '$signingMode'." }
          if ($signingMode -eq 'certificate') {
            if ([string]::IsNullOrWhiteSpace($env:THSV_WINDOWS_SIGNING_CERTIFICATE_BASE64)) { throw 'Certificate signing mode requires WINDOWS_SIGNING_CERTIFICATE_BASE64.' }
            if ([string]::IsNullOrWhiteSpace($env:THSV_WINDOWS_SIGNING_ALLOWED_THUMBPRINTS)) { throw 'Certificate signing mode requires WINDOWS_SIGNING_ALLOWED_THUMBPRINTS.' }
            $certificatePath = Join-Path $env:RUNNER_TEMP 'streambridge-signing.pfx'
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:THSV_WINDOWS_SIGNING_CERTIFICATE_BASE64))
            "THSV_WINDOWS_SIGNING_PFX=$certificatePath" >> $env:GITHUB_ENV
          } else {
            Write-Host 'Publishing in intentional unsigned mode with checksums and GitHub attestations.'
          }
          "THSV_REQUIRE_VALID_RUNTIME_SIGNATURE=1" >> $env:GITHUB_ENV
      - name: Build and smoke-test the release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: .\scripts\test-release-candidate.ps1 -CurrentTag $env:RELEASE_TAG
      - name: Retain the commit-bound validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-${{ env.RELEASE_TAG }}
          path: artifacts/release-validation/latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Attest the protected validation receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release-validation/latest.json
      - name: Run real Windows ACL acceptance
        shell: powershell
        run: |
          $archive = Get-ChildItem packages\THSV-StreamBridge-*.zip | Where-Object { $_.Name -notlike 'THSV-StreamBridge-AddOn-*' } | Select-Object -First 1
          if ($null -eq $archive) { throw 'Release archive was not produced for ACL acceptance.' }
          .\tests\windows\installer-acl.tests.ps1 -ArchivePath $archive.FullName
      - name: Generate production SBOM
        shell: powershell
        run: |
          $sbom = npm sbom --omit=dev --sbom-format cyclonedx | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'SBOM generation failed.' }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("THSV-StreamBridge-${{ env.RELEASE_TAG }}.cdx.json", $sbom, $utf8NoBom)
      - name: Remove the temporary Windows signing identity
        if: always()
        shell: powershell
        run: if (-not [string]::IsNullOrWhiteSpace($env:THSV_WINDOWS_SIGNING_PFX)) { Remove-Item -LiteralPath $env:THSV_WINDOWS_SIGNING_PFX -Force }
      - name: Resolve release asset paths
        id: assets
        shell: powershell
        run: |
          $archive = Get-ChildItem packages\THSV-StreamBridge-*.zip | Where-Object { $_.Name -notlike 'THSV-StreamBridge-AddOn-*' } | Select-Object -First 1
          $addons = @(Get-ChildItem packages\THSV-StreamBridge-AddOn-*.zip)
          $index = Get-Content packages\THSV-StreamBridge-AddOns-index.json -Raw | ConvertFrom-Json
          $expectedAddons = @($index.packages | ForEach-Object { $_.archiveName } | Sort-Object)
          $actualAddons = @($addons | ForEach-Object { $_.Name } | Sort-Object)
          if ($null -eq $archive) { throw 'Release archive was not produced.' }
          if (($expectedAddons -join "`n") -ne ($actualAddons -join "`n")) {
            throw "Release add-on assets do not match the generated optional add-on index: expected [$($expectedAddons -join ', ')], found [$($actualAddons -join ', ')]"
          }
          foreach ($addon in $addons) {
            if (-not (Test-Path -LiteralPath "$($addon.FullName).sha256")) { throw "Missing checksum for optional add-on $($addon.Name)." }
          }
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$($archive.FullName).sha256" >> $env:GITHUB_OUTPUT
      - name: Generate release evidence manifest and checksum
        shell: powershell
        run: .\scripts\new-release-evidence.ps1 -Tag $env:RELEASE_TAG -CommitSha $env:RELEASE_COMMIT_SHA -Repository $env:SOURCE_REPOSITORY -SbomPath "THSV-StreamBridge-$env:RELEASE_TAG.cdx.json"
      - name: Create the release tag in this repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:GITHUB_SHA"
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.archive }}
            packages/THSV-StreamBridge-AddOns-index.json
      - name: Attest software bill of materials
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.assets.outputs.archive }}
          sbom-path: THSV-StreamBridge-${{ env.RELEASE_TAG }}.cdx.json
      - name: Attest release evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            THSV-StreamBridge-${{ env.RELEASE_TAG }}.release-evidence.json
            THSV-StreamBridge-${{ env.RELEASE_TAG }}.release-evidence.json.sha256
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $isPrerelease = $env:RELEASE_TAG -match '-(?:alpha|beta|preview|rc)(?:\.|-|$)'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $notesFile = "docs/releases/$version.md"
          $releaseFlags = @('--repo', $repo, '--draft', '--verify-tag')
          if (Test-Path -LiteralPath $notesFile) { $releaseFlags += @('--notes-file', $notesFile) } else { $releaseFlags += @('--notes', "THSV StreamBridge $version") }
          if ($isPrerelease) { $releaseFlags += '--prerelease' }
          gh release create $env:RELEASE_TAG @releaseFlags
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }
          $assets = @("${{ steps.assets.outputs.archive }}", "${{ steps.assets.outputs.checksum }}", "THSV-StreamBridge-$env:RELEASE_TAG.cdx.json", "THSV-StreamBridge-$env:RELEASE_TAG.release-evidence.json", "THSV-StreamBridge-$env:RELEASE_TAG.release-evidence.json.sha256")
          $assets += @(Get-ChildItem packages\THSV-StreamBridge-AddOn-*.zip, packages\THSV-StreamBridge-AddOn-*.zip.sha256 | ForEach-Object FullName)
          $assets += @(Get-ChildItem packages\THSV-StreamBridge-AddOns-index.json, packages\THSV-StreamBridge-AddOns-index.json.sha256 | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @assets --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Uploading release files failed.' }
          if ($isPrerelease) { gh release edit $env:RELEASE_TAG --repo $repo --draft=false } else { gh release edit $env:RELEASE_TAG --repo $repo --draft=false --latest }
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
      - name: Verify the published release the way installs do
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $dir = Join-Path $env:RUNNER_TEMP 'published'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern "THSV-StreamBridge-$version.zip" --pattern "THSV-StreamBridge-$version.zip.sha256" --dir $dir --clobber
          .\scripts\verify-release-archive.ps1 -ArchivePath (Join-Path $dir "THSV-StreamBridge-$version.zip") -ChecksumPath (Join-Path $dir "THSV-StreamBridge-$version.zip.sha256") -Repository $env:GITHUB_REPOSITORY

  sync-docs:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: site
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false
      - name: Copy the user guides and release notes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/docs
          mkdir -p site/docs
          cp -R source/docs/. site/docs/
          # Developer and internal design notes stay private with the source.
          rm -rf site/docs/archive site/docs/release site/docs/release.md site/docs/architecture.md site/docs/contracts-v2.md \
            site/docs/add-on-development.md site/docs/add-on-capabilities.md site/docs/module-system.md site/docs/testing.md \
            site/docs/streamerbot-csharp-references.md site/docs/integration-assumptions.md site/docs/offline-acceptance.md \
            site/docs/recovery-bundles.md site/docs/setup.md
          cp source/LICENSE source/THIRD-PARTY-NOTICES.md source/RELEASE-VERIFICATION.md source/SECURITY.md site/
      - name: Commit when anything changed
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then echo 'Docs already current.'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update guides for ${RELEASE_TAG}"
          git push origin HEAD:main
